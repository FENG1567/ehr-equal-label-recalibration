name: aggregate-reproduction
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: envs/requirements-public.lock.txt
      - run: python -m pip install -r envs/requirements-public.lock.txt
      - run: python scripts/check_release.py
      - run: python scripts/reproduce.py --verify-only
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py --output outputs
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-displays
          path: outputs/
